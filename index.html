<!DOCTYPE html>
<html lang="en">
<head>

    <title>Encontrinho? 🌹</title>
    <link rel="stylesheet" href="styles.css">

</head>
<body>

        <img src="./assets/emoji-rosa-na-boca.png" alt="Emoji de rosa na boca" width="100">

    <main>
